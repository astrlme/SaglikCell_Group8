services:
  postgres:
    image: postgres:16-alpine
    container_name: saglikcell-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saglikcell}
      POSTGRES_USER: ${POSTGRES_USER:-saglikcell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saglikcell}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Init scripts run in alphabetical order on first container start
      # (only when the data volume is empty).
      - ./backend/SaglikCell.Infrastructure/sql/schema:/docker-entrypoint-initdb.d/01-schema:ro
      - ./backend/SaglikCell.Infrastructure/sql/seed:/docker-entrypoint-initdb.d/02-seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saglikcell} -d ${POSTGRES_DB:-saglikcell}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saglikcell-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: saglikcell-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@saglikcell.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - saglikcell-net

volumes:
  pgdata:
  pgadmin-data:

networks:
  saglikcell-net:
    driver: bridge
