services:
  postgres:
    image: postgres:16-alpine
    container_name: saglikcell-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saglikcell}
      POSTGRES_USER: ${POSTGRES_USER:-saglikcell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saglikcell}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/SaglikCell.Infrastructure/sql:/sql:ro
      - ./backend/SaglikCell.Infrastructure/sql/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saglikcell} -d ${POSTGRES_DB:-saglikcell}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saglikcell-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saglikcell-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-saglikcell};Username=${POSTGRES_USER:-saglikcell};Password=${POSTGRES_PASSWORD:-saglikcell}"
      Jwt__Key: ${JWT_KEY:-super-secret-key-for-saglikcell-demo-please-change-me-32chars}
      Jwt__Issuer: ${JWT_ISSUER:-SaglikCell}
      Jwt__Audience: ${JWT_AUDIENCE:-SaglikCellUsers}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-60}
      Jwt__RefreshTokenDays: ${JWT_REFRESH_TOKEN_DAYS:-7}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - saglikcell-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: saglikcell-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@test.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - saglikcell-net

volumes:
  pgdata:
  pgadmin-data:

networks:
  saglikcell-net:
    driver: bridge
